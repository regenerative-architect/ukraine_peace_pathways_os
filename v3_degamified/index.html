ral Assembly leadership on sovereignty and ceasefire","date":"2026-02-24","class":"INSTITUTIONAL POSITION","confidence":"High: attributed public statement","claim":"UN General Assembly leadership reiterated Ukrainian sovereignty and internationally recognized borders, cessation of hostilities, and the importance of a UN Charter-based negotiated peace.","url":"https://www.un.org/pga/80/2026/02/24/pga-remarks-at-the-general-assembly-eleventh-emergency-special-session-resumed-the-situation-in-temporarily-occupied-ukraine-delivered-by-vice-president/","implication":"Settlement proposals must disclose and test compatibility with international law; do not treat territorial coercion as consent."},{"id":"paris-2026","name":"Paris declaration on security guarantees","date":"2026-01-06","class":"MULTILATERAL POSITION","confidence":"High: primary public statement","claim":"Ukraine, the US and Coalition of the Willing participants stressed sovereign security and politically/legally binding guarantees to take effect after a ceasefire; pledges remain subject to their legal arrangements.","url":"https://www.president.gov.ua/en/news/parizka-deklaraciya-nadijni-garantiyi-bezpeki-dlya-micnogo-j-102313","implication":"Security arrangements require named guarantors, domestic authority, clear trigger, verification, and credible breach response."},{"id":"uk-e3-jun","name":"E3 and Ukrainian leaders on negotiation conditions","date":"2026-06-07","class":"MULTILATERAL POSITION","confidence":"High: government statement","claim":"Leaders called for immediate ceasefire, negotiations beginning from the line of contact without changing borders by force, legally binding security guarantees, and appropriate EU/NATO consent for arrangements involving them.","url":"https://www.gov.uk/government/news/joint-e3-leaders-statement-with-president-volodymyr-zelenskyy-of-ukraine-7-june-2026","implication":"Distinguish negotiating starting points from territorial recognition; EU and NATO are not bound by ext
